# MODELO de configuração do nginx para este serviço.
#
# Copie para o conf.d/ do seu nginx e ajuste server_name e os caminhos
# dos certificados. Este arquivo é referência: editá-lo aqui não afeta
# nenhum servidor.
#
# transcriptor — proxy reverso, acesso público.
#
# O que protege a VPS, já que o acesso é aberto:
#   - rate limiting e limite de conexões, abaixo
#   - cota por sessão e uma transcrição por vez no container
#   - a limpeza automática, que impede o disco de encher
#
# Cada visitante enxerga só os próprios downloads (o app isola por cookie).
# Isso é separação, não autenticação: não impede ninguém de usar.

# Zonas de limite. Ficam fora de server{} porque a memória é compartilhada
# entre os workers; 10m guarda cerca de 160 mil endereços.
limit_req_zone  $binary_remote_addr zone=tsc_api:10m  rate=30r/m;
limit_req_zone  $binary_remote_addr zone=tsc_jobs:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=tsc_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name transcription.pvss.dev.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name transcription.pvss.dev.br;

    ssl_certificate     /etc/letsencrypt/live/transcription.pvss.dev.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/transcription.pvss.dev.br/privkey.pem;
    include              /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam          /etc/letsencrypt/ssl-dhparams.pem;

    # DNS interno do Docker. Resolver por variável adia a busca para a hora da
    # requisição; um bloco `upstream` estático é resolvido na inicialização, e
    # o nginx inteiro — inclusive pvss.dev.br — se recusaria a subir sempre que
    # o container da app estivesse parado.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://transcriptor:8000;

    # Um stream SSE segura a conexão durante todo o job, então este limite
    # também limita quantos jobs um mesmo endereço acompanha ao mesmo tempo.
    limit_conn tsc_conn 12;

    limit_req_status  429;
    limit_conn_status 429;

    # Uploads. Este limite fica logo ACIMA do limite da aplicação (500 MB por
    # padrão, TRANSCRIPTOR_MAX_UPLOAD_MB): o nginx confere o Content-Length e
    # recusa na hora, enquanto o app só recusaria depois de receber o arquivo
    # inteiro. A folga de 12 MB cobre o cabeçalho multipart e deixa o app dar a
    # mensagem precisa nos casos de fronteira.
    #
    # Se aumentar TRANSCRIPTOR_MAX_UPLOAD_MB, aumente este valor junto.
    client_max_body_size 512m;
    client_body_timeout  300s;

    # Transcrever um áudio longo passa fácil dos 60s padrão.
    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass $app$request_uri;
    }

    # Enviar arquivo é o caminho caro: cada um custa minutos de CPU no Whisper.
    location = /api/transcribe {
        limit_req zone=tsc_jobs burst=2 nodelay;
        proxy_pass $app$request_uri;
    }

    # `location /api/jobs/` (com barra) faz o nginx devolver 301 para a forma
    # sem barra -- e um DELETE redirecionado vira GET, quebrando silenciosamente
    # a limpeza da lista. Um match exato tem precedência e evita o redirect.
    location = /api/jobs {
        limit_req zone=tsc_api burst=10 nodelay;
        proxy_pass $app$request_uri;
    }

    # Barata, mas é o primeiro alvo de quem varre a internet. A zona tsc_api
    # cobre as rotas de API que não são upload nem SSE; os arquivos estáticos
    # ficam de fora porque uma única visita já busca quatro deles.
    location = /api/health {
        limit_req zone=tsc_api burst=10 nodelay;
        proxy_pass $app$request_uri;
    }

    # O progresso chega por Server-Sent Events. Com o buffering padrão do
    # nginx o stream inteiro fica retido até terminar, e a barra ficaria em 0%
    # até pular para 100%. Estas três linhas são o que faz o progresso ao vivo
    # funcionar através do proxy.
    #
    # Sem limit_req aqui: reconectar a um stream já aberto não é abuso, e uma
    # reconexão recusada congelaria a barra de um job em andamento.
    location /api/jobs/ {
        proxy_pass $app$request_uri;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_read_timeout 24h;
    }
}